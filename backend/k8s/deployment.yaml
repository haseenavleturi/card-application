apiVersion: apps/v1
kind: Deployment
metadata:
  name: card-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: card-management
  template:
    metadata:
      labels:
        app: card-management
    spec:
      containers:
        - name: card-management
          image: haseena63/card-management-web:latest
          ports:
            - containerPort: 5030